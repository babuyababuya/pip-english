<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>皮皮英语 · 打开统计</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fff4e8;
      color: #2b2118;
    }
    main { max-width: 640px; margin: 0 auto; padding: 28px 18px 48px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { line-height: 1.5; }
    .muted { color: #8a7363; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
    .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 8px 24px rgba(80, 40, 10, 0.06); }
    .card b { display: block; font-size: 28px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 16px; overflow: hidden; }
    th, td { text-align: right; padding: 10px 12px; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #8a7363; font-weight: 650; font-size: 13px; }
    tr + tr td { border-top: 1px solid #f3e6da; }
    button {
      margin-top: 16px;
      border: 0;
      background: #ff6b4a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
    }
    .err { color: #9a3412; }
  </style>
</head>
<body>
  <main>
    <h1>打开统计</h1>
    <p class="muted">同一浏览器、同一天只记一次。日期按北京时间。中文浏览器和其他语言分开记。</p>
    <div class="cards">
      <div class="card">今天<b id="today">…</b></div>
      <div class="card">近 14 天<b id="fortnight">…</b></div>
      <div class="card">其中其他语言<b id="other">…</b></div>
    </div>
    <table>
      <thead><tr><th>日期</th><th>中文</th><th>其他语言</th><th>合计</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="note" class="muted">正在读取。</p>
    <button type="button" id="reload">刷新</button>
  </main>
  <script>
    var NS = "pipenk7m2q9x4b";
    function dayKey(d) {
      var shifted = new Date(d.getTime() + 8 * 60 * 60 * 1000);
      var month = String(shifted.getUTCMonth() + 1).padStart(2, "0");
      var day = String(shifted.getUTCDate()).padStart(2, "0");
      return shifted.getUTCFullYear() + "-" + month + "-" + day;
    }
    function read(key) {
      return fetch("https://abacus.jasoncameron.dev/get/" + NS + "/" + key, { cache: "no-store" })
        .then(function (res) {
          if (res.status === 404) return 0;
          if (!res.ok) throw new Error("read");
          return res.json().then(function (data) { return data.value || 0; });
        });
    }
    function load() {
      var note = document.getElementById("note");
      note.className = "muted";
      note.textContent = "正在读取。";
      var days = [];
      for (var i = 0; i < 14; i++) days.push(dayKey(new Date(Date.now() - i * 86400000)));
      var jobs = [];
      days.forEach(function (day) {
        jobs.push(read("zh-" + day).then(function (n) { return { day: day, bucket: "zh", n: n }; }));
        jobs.push(read("other-" + day).then(function (n) { return { day: day, bucket: "other", n: n }; }));
      });
      var index = 0;
      var results = [];
      function next() {
        if (index >= jobs.length) return Promise.resolve();
        var job = jobs[index++];
        return job.then(function (row) {
          results.push(row);
          return next();
        });
      }
      Promise.all([next(), next(), next(), next()]).then(function () {
        var byDay = {};
        days.forEach(function (day) { byDay[day] = { zh: 0, other: 0 }; });
        results.forEach(function (row) { byDay[row.day][row.bucket] = row.n; });
        var body = document.getElementById("rows");
        var fortnight = 0;
        var other = 0;
        body.innerHTML = days.map(function (day) {
          var zh = byDay[day].zh;
          var rest = byDay[day].other;
          var total = zh + rest;
          fortnight += total;
          other += rest;
          return "<tr><td>" + day + "</td><td>" + zh + "</td><td>" + rest + "</td><td>" + total + "</td></tr>";
        }).join("");
        document.getElementById("today").textContent = (byDay[days[0]].zh + byDay[days[0]].other);
        document.getElementById("fortnight").textContent = fortnight;
        document.getElementById("other").textContent = other;
        note.textContent = fortnight
          ? "这里记的是有人打开网页。统计页本身不会被记入。"
          : "这 14 天还没有记录。有人打开学习页之后，刷新这里就能看到。";
      }).catch(function () {
        note.className = "err";
        note.textContent = "暂时读不到数字。过一会儿再点刷新。";
      });
    }
    document.getElementById("reload").addEventListener("click", load);
    load();
  </script>
</body>
</html>
